<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskTrack | Student Tasks</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>

</head>
<body>

  <main id="app">
    <p>Loading TaskTrack...</p>
  </main>

  <template id="sign-in-template">
  <section class="sign-in-page" aria-labelledby="sign-in-title">
    <div class="sign-in-card">
      <p class="brand-name">TaskTrack</p>
      <h1 id="sign-in-title">Welcome back</h1>
      <p class="sign-in-description">
        Choose how you want to sign in.
      </p>

      <div class="login-options">
        <button class="login-option" type="button" data-role="student">
          <span class="login-option-icon" aria-hidden="true">🎓</span>
          <span>
            <strong>Student Login</strong>
            <small>View and track your assigned tasks</small>
          </span>
        </button>

        <button class="login-option" type="button" data-role="teacher">
          <span class="login-option-icon" aria-hidden="true">👩‍🏫</span>
          <span>
            <strong>Teacher Login</strong>
            <small>Create and manage student tasks</small>
          </span>
        </button>
      </div>
    </div>
  </section>
</template>

<template id="student-sign-in-template">
  <section class="auth-page" aria-labelledby="student-sign-in-title">
    <div class="auth-card">
      <p class="auth-role">Student Portal</p>
      <h1 id="student-sign-in-title">Student sign in</h1>
      <p>Enter your details to view your assigned tasks.</p>

      <form class="auth-form">
        <label for="student-username">Username</label>
        <input
          id="student-username"
          name="username"
          type="text"
          autocomplete="username"
          required
        >

        <label for="student-password">Password</label>
        <input
          id="student-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Sign in as student</button>
      </form>
      <p class="auth-message" aria-live="polite"></p>
    </div>
  </section>
</template>

<template id="teacher-sign-in-template">
  <section class="auth-page" aria-labelledby="teacher-sign-in-title">
    <div class="auth-card">
      <p class="auth-role">Teacher Portal</p>
      <h1 id="teacher-sign-in-title">Teacher sign in</h1>
      <p>Enter your details to manage student tasks.</p>

      <form class="auth-form">
        <label for="teacher-username">Username</label>
        <input
          id="teacher-username"
          name="username"
          type="text"
          autocomplete="username"
          required
        >

        <label for="teacher-password">Password</label>
        <input
          id="teacher-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Sign in as teacher</button>
      </form>
      <p class="auth-message" aria-live="polite"></p>
    </div>
  </section>
</template>

<template id="student-dashboard-template">
  <section class="student-dashboard">
    <header class="dashboard-header">
      <div>
        <p class="dashboard-brand">TaskTrack · Student space</p>
        <h1>Student Dashboard</h1>
        <p class="dashboard-intro">
          Keep today’s practice clear, focused, and moving forward.
        </p>
      </div>

      <p class="dashboard-note">Today’s tasks</p>
    </header>

<section class="today-section" aria-labelledby="today-title">
  <div class="section-heading">
    <div>
      <p class="section-label">Today</p>
      <h2 id="today-title">Your focus for today</h2>
    </div>
    <p class="task-count">0 tasks</p>
  </div>

  <div class="today-task-list"></div>
</section>
    <student-kanban></student-kanban>
    <student-history></student-history>
  </section>
</template>

<template id="teacher-dashboard-template">
  <section class="teacher-dashboard">
    <header class="dashboard-header">
      <p class="dashboard-brand">TaskTrack</p>
      <h1>Teacher Dashboard</h1>
      <p>Create and manage Aptitude and DSA tasks for students.</p>
    </header>

    <section class="empty-state">
      <h2>No tasks created yet</h2>
      <p>Your created tasks will appear here.</p>
    </section>
  </section>
</template>

<template id="student-kanban-template">
  <section class="kanban-section" aria-labelledby="kanban-title">
    <div class="kanban-heading">
      <div>
        <p class="section-label">Progress board</p>
        <h2 id="kanban-title">Your practice board</h2>
      </div>
      <p class="kanban-help">Tasks are grouped by current progress.</p>
    </div>

    <div class="kanban-board">
      <section
        class="kanban-column"
        data-status="not-done"
        aria-labelledby="not-done-title"
      >
        <header class="column-header">
          <h3 id="not-done-title">Not done</h3>
          <span data-status-count>0</span>
        </header>

        <div class="kanban-card-list" data-status-list></div>
      </section>

      <section
        class="kanban-column"
        data-status="in-progress"
        aria-labelledby="in-progress-title"
      >
        <header class="column-header">
          <h3 id="in-progress-title">In progress</h3>
          <span data-status-count>0</span>
        </header>

        <div class="kanban-card-list" data-status-list></div>
      </section>

      <section
        class="kanban-column"
        data-status="completed"
        aria-labelledby="completed-title"
      >
        <header class="column-header">
          <h3 id="completed-title">Completed</h3>
          <span data-status-count>0</span>
        </header>

        <div class="kanban-card-list" data-status-list></div>
      </section>
    </div>
  </section>
</template>

<template id="student-history-template">
  <section class="history-section" aria-labelledby="history-title">
    <div class="history-heading">
      <div>
        <p class="section-label">Task history</p>
        <h2 id="history-title">Previous practice</h2>
      </div>
      <p>Grouped by assigned date</p>
    </div>

    <div class="history-groups"></div>
  </section>
</template>

</body>
</html>
